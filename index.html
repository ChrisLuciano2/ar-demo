<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Demo</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    /* ── Start screen ───────────────────────────────────────── */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
    }

    #start-screen h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      padding: 0 32px;
    }

    #start-screen p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      text-align: center;
      padding: 0 40px;
      line-height: 1.6;
    }

    #start-btn {
      margin-top: 8px;
      padding: 16px 48px;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #start-btn:active { background: #17845f; }

    /* ── Video overlay ──────────────────────────────────────── */
    #video-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #video-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #video-container {
      width: min(92vw, 560px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      background: #000;
    }

    #ar-video {
      width: 100%;
      display: block;
    }

    #close-btn {
      margin-top: 20px;
      padding: 13px 36px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Scanning hint ──────────────────────────────────────── */
    #scan-hint {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #scan-hint.visible { opacity: 1; }
    #scan-hint.hidden  { opacity: 0; pointer-events: none; }

    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #1D9E75;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.55); }
    }
  </style>
</head>
<body>

  <!-- Start screen — a-scene does NOT exist in the DOM yet -->
  <div id="start-screen">
    <h1>AR Demo</h1>
    <p>Tap Start — your browser will ask for<br>camera access. Tap <strong style="color:#fff">Allow</strong> to continue.</p>
    <button id="start-btn">Start AR</button>
  </div>

  <!-- Scanning hint (shown after scene loads) -->
  <div id="scan-hint">
    <span class="dot"></span>
    Point camera at target
  </div>

  <!-- Video overlay -->
  <div id="video-overlay">
    <div id="video-container">
      <video
        id="ar-video"
        src="video.mp4"
        playsinline
        webkit-playsinline
        controls
        preload="metadata"
      ></video>
    </div>
    <button id="close-btn">✕ &nbsp; Close</button>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const overlay     = document.getElementById('video-overlay');
    const scanHint    = document.getElementById('scan-hint');
    const closeBtn    = document.getElementById('close-btn');
    const startBtn    = document.getElementById('start-btn');

    startBtn.addEventListener('click', () => {
      // Hide start screen
      startScreen.style.display = 'none';

      // ── Dynamically inject the a-scene AFTER the user tap ──
      // This guarantees the camera permission prompt fires as
      // a direct result of the gesture — Chrome always shows it.
      const scene = document.createElement('a-scene');
      scene.setAttribute('mindar-image',
        'imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiScanning: no;');
      scene.setAttribute('color-space', 'sRGB');
      scene.setAttribute('renderer', 'colorManagement: true; physicallyCorrectLights: true');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

      const camera = document.createElement('a-camera');
      camera.setAttribute('position', '0 0 0');
      camera.setAttribute('look-controls', 'enabled: false');
      scene.appendChild(camera);

      const target = document.createElement('a-entity');
      target.setAttribute('mindar-image-target', 'targetIndex: 0');
      target.id = 'ar-target';

      const plane = document.createElement('a-plane');
      plane.setAttribute('position', '0 0 0');
      plane.setAttribute('width', '1');
      plane.setAttribute('height', '1');
      plane.setAttribute('material', 'opacity: 0; transparent: true');
      target.appendChild(plane);

      scene.appendChild(target);
      document.body.appendChild(scene);

      // Wait for scene to be ready then wire up events
      scene.addEventListener('loaded', () => {
        scanHint.classList.add('visible');

        const arTarget = document.getElementById('ar-target');
        const video    = document.getElementById('ar-video');

        arTarget.addEventListener('targetFound', () => {
          scanHint.classList.add('hidden');
          overlay.classList.add('visible');
          video.currentTime = 0;
          video.play().catch(() => {});
        });

        arTarget.addEventListener('targetLost', () => {
          video.pause();
        });
      });
    });

    // Close button
    closeBtn.addEventListener('click', () => {
      const video = document.getElementById('ar-video');
      overlay.classList.remove('visible');
      video.pause();
      video.currentTime = 0;
      scanHint.classList.remove('hidden');
    });
  </script>

</body>
</html>
